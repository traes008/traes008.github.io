<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thomas</title>
  <meta name="description" content="Thomas: Computer Science Engineer and PhD student at Ghent University.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👋</text></svg>">
  <style>
    :root {
      --bg: #fbfbfa;
      --text: #1c1c1e;
      --muted: #6b6b72;
      --line: #e5e5e1;
      --card: #ffffff;
      --accent: #2f6fde;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111113;
        --text: #ececee;
        --muted: #9b9ba3;
        --line: #27272c;
        --card: #18181b;
        --accent: #7ea9ff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 17px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 680px; margin: 0 auto; padding: 96px 24px 64px; }

    .avatar {
      width: 72px; height: 72px; border-radius: 50%;
      display: grid; place-items: center;
      background: var(--accent); color: var(--bg);
      font-weight: 600; font-size: 26px; letter-spacing: .02em;
    }
    h1 {
      font-size: clamp(2rem, 6vw, 2.6rem);
      line-height: 1.15; letter-spacing: -.02em;
      margin: 28px 0 8px;
    }
    .tagline { color: var(--muted); font-size: 1.15rem; margin: 0; }

    section { margin-top: 64px; }
    h2 {
      font-size: .8rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: .12em;
      color: var(--muted); margin: 0 0 20px;
    }
    p { margin: 0 0 1em; }
    a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }

    .projects { display: grid; gap: 12px; }
    .project {
      display: block; padding: 18px 20px;
      background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      color: inherit; text-decoration: none;
      transition: border-color .15s, transform .15s;
    }
    .project:hover { border-color: var(--accent); transform: translateY(-1px); }
    .project h3 { margin: 0 0 4px; font-size: 1rem; }
    .project h3::after { content: " \2192"; color: var(--muted); }
    .project p { margin: 0; color: var(--muted); font-size: .95rem; }

    .links { display: flex; flex-wrap: wrap; gap: 10px; list-style: none; padding: 0; margin: 0; }
    .links a {
      display: inline-block; padding: 8px 16px;
      border: 1px solid var(--line); border-radius: 999px;
      color: var(--text); text-decoration: none; font-size: .95rem;
    }
    .links a:hover { border-color: var(--accent); color: var(--accent); }

    footer {
      margin-top: 80px; padding-top: 24px;
      border-top: 1px solid var(--line);
      color: var(--muted); font-size: .85rem;
    }

    @media (max-width: 480px) { main { padding: 64px 16px 48px; } }
    @media (prefers-reduced-motion: reduce) {
      .project { transition: none; }
      .project:hover { transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="avatar" aria-hidden="true">T</div>
      <h1>Thomas</h1>
      <p class="tagline">PhD student at Ghent University</p>
    </header>

    <section>
      <h2>About</h2>
      <p>I graduated as a Computer Science Engineer from Ghent University, and I'm currently doing a PhD there.</p>
    </section>

    <section>
      <h2>Elsewhere</h2>
      <ul class="links">
        <li><a href="https://github.com/traes008">GitHub</a></li>
      </ul>
    </section>

    <footer>© 2026 Thomas</footer>
  </main>
</body>
</html>
